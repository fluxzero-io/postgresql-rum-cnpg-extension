name: Check RUM package

on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: check-rum-package
  cancel-in-progress: false

jobs:
  check:
    name: Check PGDG package metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check PGDG package metadata
        run: ./scripts/check-rum-package.sh versions/pg18-bullseye.env

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # Scheduled runs use the retained fluxzero-bot Actions credentials.
          client-id: ${{ secrets.FLUXZERO_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLUXZERO_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: deps/update-rum-package
          title: "deps: update PostgreSQL RUM package"
          commit-message: "deps: update PostgreSQL RUM package"
          labels: |
            dependencies
            postgresql-rum
          delete-branch: true
          add-paths: versions/pg18-bullseye.env
