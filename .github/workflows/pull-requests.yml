name: Pull requests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: pull-requests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Build and smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build extension image and run smoke test
        run: ./scripts/smoke-test.sh versions/pg18-bullseye.env
